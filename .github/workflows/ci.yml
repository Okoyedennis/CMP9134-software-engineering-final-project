name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Trigger on main branch push
  pull_request:
    branches:
      - main # Trigger on PR to main branch

jobs:
  # Job 1: Build and Test with Docker Compose
  build_and_test:
    runs-on: ubuntu-latest

    services:
      # MongoDB Service
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and run Docker containers
        run: |
          docker-compose -f docker-compose.yml up -d --build

      - name: Run tests for Backend
        run: |
          docker-compose exec -T backend npm run test

      # Uncomment to run frontend tests
      # - name: Run tests for Frontend
      #   run: |
      #     docker-compose exec -T frontend npm run test

      - name: Tear down the containers
        run: |
          docker-compose down

      # Docker Hub login step
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push Docker images to Docker Hub
      - name: Push Docker Images
        run: |
          docker build -t dennis07okoye/my-frontend-image ./frontend
          docker push dennis07okoye/my-frontend-image
          docker build -t dennis07okoye/my-backend-image ./backend
          docker push dennis07okoye/my-backend-image
